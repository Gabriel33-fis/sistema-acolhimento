services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acolhimento_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/acolhimento.db
      - SECRET_KEY=sua_chave_secreta_super_segura_jwt_2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acolhimento_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
